{{ define "main" }}
<main class="writing-page" id="writing-main">
  <a class="view-home" href="{{ "/" | relURL }}" aria-label="Back to top-level view">/..</a>
  <header class="page-intro">
    <h1>{{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Description }}<p>{{ . | markdownify }}</p>{{ end }}
  </header>
  <div class="writing-body">{{ .Content }}</div>
</main>
{{ end }}
