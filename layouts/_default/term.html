{{/* One tag: the tagged pieces, collections and writings, newest first.
     Kind "term". Reached from any #tag link on the site. */}}
{{ define "main" }}
<main class="archive">
  <h1><a class="tag-heading" href="{{ "/tags/" | relURL }}">#{{ .LinkTitle }}</a></h1>
  <div class="timeline">
    {{- range sort .Pages "Date" "desc" }}{{ partial "listing/item-card.html" . }}{{ end }}
  </div>
</main>
{{ end }}
