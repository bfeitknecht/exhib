<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default site.Params.description | markdownify | plainify | htmlEscape }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  {{- $css := resources.Get "css/site.css" | resources.Minify | resources.Fingerprint "sha256" }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }} RSS" href="{{ "rss.xml" | relURL }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.Title }} Atom" href="{{ "atom.xml" | relURL }}">
</head>
<body>
  <header class="global-header">
    <a href="https://0xbf.ch/">0xbf.ch</a>
    {{ partial "listing/view-nav.html" . }}
  </header>
  {{ block "main" . }}{{ end }}
  {{ if eq .Section "collections" }}<script src="{{ "js/viewer-keys.js" | relURL }}" defer></script>{{ end }}
</body>
</html>
