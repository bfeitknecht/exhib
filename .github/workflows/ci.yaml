name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Format check
        run: uvx ruff@0.15 format --check src
      - name: Lint
        run: uvx ruff@0.15 check src
