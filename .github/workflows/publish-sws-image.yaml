name: Publish SWS Image

# Builds sws.Dockerfile (upstream SWS + baked sws.toml) and pushes
# ghcr.io/<repository>-sws, i.e. ghcr.io/bfeitknecht/exhib-sws.
# Mirrors publish-image.yaml; kept here so the serving image and its
# configuration live in the app repo, not in infra.

on:
  push:
    tags:
      - "v*" # Triggers on tags like v0.1.0, v1.0.0, etc.
  # Republish the current HEAD without a tag:
  #   gh workflow run publish-sws-image.yaml
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./sws.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-sws:latest
            ghcr.io/${{ github.repository }}-sws:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
