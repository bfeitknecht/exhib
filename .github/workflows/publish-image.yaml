name: Publish Image

on:
  push:
    tags:
      - "v*" # Triggers on tags like v0.1.0, v1.0.0, etc.
  # Republish the current HEAD without a tag:
  #   gh workflow run publish-image.yaml
  workflow_dispatch:

jobs:
  publish:
    # The called workflow receives only the GITHUB_TOKEN that the caller grants.
    # The default token is read-only, so packages: write is granted here.
    permissions:
      contents: read
      packages: write
    # The build and push logic is in the infra repo.
    uses: bfeitknecht/infra/.github/workflows/publish-image.yaml@master
