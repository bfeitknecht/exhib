<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>upload · gallery</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Commit Mono"; src: url("/fonts/CommitMono-400-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Commit Mono"; src: url("/fonts/CommitMono-700-Regular.woff2") format("woff2"); font-weight: 700; }
:root { --bg: oklch(96% 0 0); --fg: oklch(21% 0 0); --muted: oklch(47% 0 0); color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: oklch(17% 0 0); --fg: oklch(95% 0 0); --muted: oklch(70% 0 0); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Commit Mono", ui-monospace, monospace; }
main { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 { font-size: 1rem; margin: 0 0 1.5rem; }
h1 a { color: inherit; }
label { display: block; margin: 1rem 0 .25rem; color: var(--muted); }
input, select, textarea, button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--muted); border-radius: 0; padding: .5rem .6rem; width: 100%; }
textarea { min-height: 6rem; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
#drop { margin-top: 1.25rem; border: 1px dashed var(--muted); padding: 2rem 1rem; text-align: center; color: var(--muted); cursor: pointer; }
#drop.over { border-style: solid; color: var(--fg); }
ul { list-style: none; padding: 0; margin: 1rem 0; }
li { display: grid; grid-template-columns: 1fr auto; gap: .5rem; padding: .3rem 0; border-bottom: 1px solid color-mix(in oklch, var(--muted) 30%, transparent); overflow-wrap: anywhere; }
li .bar { grid-column: 1 / -1; height: 2px; background: color-mix(in oklch, var(--muted) 25%, transparent); }
li .bar i { display: block; height: 100%; width: 0; background: var(--fg); }
button { margin-top: 1.5rem; background: var(--fg); color: var(--bg); border-color: var(--fg); cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
#msg { margin-top: 1rem; min-height: 1.5em; }
.muted { color: var(--muted); }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1><a href="/">gallery</a> / upload</h1>
  <form id="form" autocomplete="off">
    <div class="row">
      <div><label for="kind">kind</label>
        <select id="kind"><option value="collection">collection</option><option value="piece">piece</option><option value="writing">writing</option></select></div>
      <div><label for="date">date</label><input id="date" type="datetime-local" required></div>
    </div>
    <label for="title">title</label><input id="title" required>
    <label for="slug">slug <span class="muted">(url)</span></label><input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*">
    <label for="description">description <span class="muted">(markdown, optional)</span></label><textarea id="description"></textarea>
    <label for="tags">tags <span class="muted">(space separated, optional)</span></label><input id="tags">
    <div id="media">
      <label for="sort">order</label>
      <select id="sort"><option value="date">by capture date (photo dumps)</option><option value="position">by file name</option></select>
      <div id="drop">drop photos and videos here, or tap to choose<input id="files" type="file" multiple accept="image/*,video/*,.heic,.heif" class="hidden"></div>
      <ul id="list"></ul>
    </div>
    <div id="writing" class="hidden"><label for="body">body <span class="muted">(markdown)</span></label><textarea id="body" style="min-height:14rem"></textarea></div>
    <button id="go" type="submit">upload</button>
    <div id="msg" class="muted"></div>
    <div id="queue" class="muted"></div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const files = [];
const slugify = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
let slugTouched = false;
const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
$("date").value = now.toISOString().slice(0, 16);
$("title").addEventListener("input", () => { if (!slugTouched) $("slug").value = slugify($("title").value); });
$("slug").addEventListener("input", () => { slugTouched = true; });
$("kind").addEventListener("change", () => {
  const w = $("kind").value === "writing";
  $("media").classList.toggle("hidden", w); $("writing").classList.toggle("hidden", !w);
});
function render() {
  $("list").innerHTML = "";
  files.forEach((f, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span></span><span class="muted"></span><span class="bar"><i></i></span>`;
    li.children[0].textContent = f.name;
    li.children[1].textContent = (f.size / 1048576).toFixed(1) + " MB";
    f.li = li; $("list").appendChild(li);
  });
}
function add(list) { for (const f of list) if (!files.some((g) => g.name === f.name && g.size === f.size)) files.push(f); render(); }
$("drop").addEventListener("click", () => $("files").click());
$("files").addEventListener("change", (e) => add(e.target.files));
["dragenter", "dragover"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => add(e.dataTransfer.files));
async function api(path, opts = {}) {
  const r = await fetch("/upload/api/" + path, { credentials: "same-origin", ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function put(id, f) {
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/upload/api/${id}/files/${encodeURIComponent(f.name)}`);
    x.upload.onprogress = (e) => { if (e.lengthComputable) f.li.querySelector("i").style.width = (100 * e.loaded / e.total) + "%"; };
    x.onload = () => x.status < 300 ? ok() : fail(new Error((JSON.parse(x.responseText || "{}").error) || x.statusText));
    x.onerror = () => fail(new Error("network error"));
    x.send(f);
  });
}
async function queue() {
  try { const q = await api("queue"); $("queue").textContent = q.queued.length ? "in the inbox: " + q.queued.join(", ") : ""; } catch {}
}
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const writing = $("kind").value === "writing";
  if (!writing && !files.length) { $("msg").textContent = "add some files first"; return; }
  $("go").disabled = true;
  const offset = -new Date($("date").value).getTimezoneOffset();
  const sign = offset >= 0 ? "+" : "-", hh = String(Math.floor(Math.abs(offset) / 60)).padStart(2, "0"), mm = String(Math.abs(offset) % 60).padStart(2, "0");
  const fields = {
    kind: $("kind").value, title: $("title").value.trim(), slug: $("slug").value.trim(),
    date: `${$("date").value}:00${sign}${hh}:${mm}`, description: $("description").value.trim(),
    tags: $("tags").value.split(/\s+/).filter(Boolean), sort: $("sort").value, body: $("body").value,
  };
  let id;
  try {
    $("msg").textContent = "starting…";
    id = (await api("start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(fields) })).id;
    if (!writing) for (const [i, f] of files.entries()) { $("msg").textContent = `uploading ${i + 1} / ${files.length}…`; await put(id, f); }
    const r = await api(`${id}/finish`, { method: "POST" });
    $("msg").textContent = `queued '${r.queued}'. the gallery updates in a few minutes.`;
    files.length = 0; render(); queue();
  } catch (err) {
    $("msg").textContent = "error: " + err.message;
    if (id) api(`${id}/abort`, { method: "POST" }).catch(() => {});
  } finally { $("go").disabled = false; }
});
queue();
</script>
</body>
</html>
