# Mirror of .github/workflows/ci.yaml for a Forgejo runner. Differences: the
# runner label. Hugo steps need hugo on the runner image; the act image ships
# it. If not, install it in a step.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/astral-sh/setup-uv@v7
      - name: Format check
        run: uvx ruff@0.15 format --check processor entrypoint.py tools/manifest/src
      - name: Lint
        run: uvx ruff@0.15 check processor entrypoint.py tools/manifest/src
