# Mirror of the GitHub publish workflow, self-contained for a Forgejo runner
# (no reusable workflow from another repository). Differences:
#   - runs-on: the cluster forgejo-runner label (arm64, native)
#   - GHCR login reads the GHCR_TOKEN secret: add it in the repository
#     settings with a GitHub PAT (write:packages). Forgejo has no implicit
#     GITHUB_TOKEN that can push to ghcr.io.
# While both this workflow and the GitHub one run per tag, they publish the
# same image; keep Actions off on the mirror to publish from one place.
name: Publish Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: https://github.com/docker/login-action@v4
        with:
          registry: ghcr.io
          username: bfeitknecht
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bfeitknecht/exhib:latest
            ghcr.io/bfeitknecht/exhib:${{ github.ref_name }}
