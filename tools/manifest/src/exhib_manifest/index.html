<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exhib manifest</title>
<style>
  :root {
    --bg: oklch(96% 0 0); --fg: oklch(21% 0 0); --muted: oklch(47% 0 0);
    --line: oklch(85% 0 0); --field: oklch(99% 0 0); --bad: oklch(50% 0.17 25);
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: "Commit Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --card: 1.41421356;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: oklch(17% 0 0); --fg: oklch(95% 0 0); --muted: oklch(70% 0 0);
            --line: oklch(32% 0 0); --field: oklch(21% 0 0); --bad: oklch(70% 0.15 25); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
  header, main, footer { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; }
  header { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
  .mono, label, .chip, button, .badge, time { font-family: var(--mono); font-size: .8rem; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .path { display: flex; align-items: baseline; gap: .1rem; font: 600 1.4rem var(--sans); }
  .path .root { color: var(--muted); font-weight: 400; }
  .path input { font: inherit; color: var(--fg); background: transparent; border: 0; border-radius: 0;
                border-bottom: 1px solid var(--line); padding: 0 .1rem; width: 14ch; outline: none; }
  .path input:focus { border-bottom-color: var(--fg); }
  .pathbox { position: relative; }
  .menu { position: absolute; left: 0; top: calc(100% + .3rem); z-index: 10; min-width: 100%; max-height: 50vh;
          overflow: auto; margin: 0; padding: .25rem 0; list-style: none; background: var(--field);
          border: 1px solid var(--line); border-radius: 3px; font: 400 .9rem var(--mono); }
  .menu li { padding: .3rem .8rem; cursor: pointer; white-space: nowrap; }
  .menu li[aria-selected=true] { background: var(--fg); color: var(--bg); }
  .menu li .muted { margin-left: .5rem; }
  .menu li[aria-selected=true] .muted { color: inherit; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 2rem; }
  @media (max-width: 860px) { .top { grid-template-columns: 1fr; } }
  label { display: block; margin: 1rem 0 .3rem; color: var(--muted); text-transform: lowercase; }
  input[type=text], input[type=number], textarea {
    width: 100%; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 3px;
    background: var(--field); color: var(--fg); font: inherit;
  }
  textarea { min-height: 6rem; resize: vertical; }
  textarea.caption { min-height: 3.2rem; }
  textarea.body { min-height: 24rem; font: 1.05rem/1.7 var(--sans); white-space: pre-wrap; }
  .hint { margin: .25rem 0 0; color: var(--muted); font-size: .8rem; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button[aria-pressed=true] { background: var(--fg); color: var(--bg); }
  button { padding: .4rem .8rem; border: 1px solid var(--line); border-radius: 3px;
           background: var(--field); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--fg); }
  button.primary, button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; padding: .35rem;
          border: 1px solid var(--line); border-radius: 3px; background: var(--field); }
  .tags input { flex: 1; min-width: 8rem; border: 0; padding: .2rem; background: transparent; color: var(--fg); font: inherit; outline: none; }
  .chip { display: inline-flex; gap: .3rem; align-items: center; padding: .1rem .5rem;
          border: 1px solid var(--line); border-radius: 999px; }
  .chip button { padding: 0 .2rem; border: 0; background: none; color: inherit; line-height: 1; }
  /* Folder list */
  .folders { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem; }
  .folders a { display: block; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 3px;
               color: var(--fg); text-decoration: none; font-family: var(--mono); }
  .folders a:hover { border-color: var(--fg); }
  /* Homepage card preview */
  .card { border-top: 1px solid var(--line); padding-top: 1rem; }
  .card .art { aspect-ratio: var(--card) / 1; background: var(--line); overflow: hidden; }
  .card .art > * { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .mosaic { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 2px; background: var(--bg); }
  .card .mosaic > * { width: 100%; height: 100%; object-fit: cover; min-height: 0; }
  .card h2 { margin: .7rem 0 .1rem; font: 600 1.15rem var(--sans); }
  .card p { margin: .4rem 0; }
  .card code { font-family: var(--mono); font-size: .9em; }
  .card .desc a { color: inherit; }
  .card .chips { display: flex; flex-wrap: wrap; gap: .3rem; }
  /* Media grid */
  .mediahead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
  .mediahead label { margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .8rem; margin-top: .6rem; }
  .tile { position: relative; padding: 0; border: 2px solid transparent; background: none; text-align: left; cursor: grab; }
  .tile.selected { border-color: var(--fg); }
  .tile.off { opacity: .35; }
  .tile.drop { border-style: dashed; border-color: var(--muted); }
  .tile .art { aspect-ratio: var(--card) / 1; background: var(--line); overflow: hidden; display: grid; place-items: center; }
  .tile .art img, .tile .art video, .tile .art canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .cap { display: block; padding: .3rem .1rem 0; font: .85rem var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badges { position: absolute; top: .3rem; left: .3rem; display: flex; gap: .25rem; }
  .badge { padding: 0 .35rem; background: var(--fg); color: var(--bg); border-radius: 2px; }
  .fallback { padding: .5rem; font: .75rem var(--mono); color: var(--muted); word-break: break-all; }
  /* Item editor */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.5rem; margin-top: 1.5rem;
            padding-top: 1rem; border-top: 1px solid var(--line); }
  @media (max-width: 860px) { .detail { grid-template-columns: 1fr; } }
  .detail .big { display: grid; place-items: center; min-height: 8rem; }
  .stage { position: relative; display: inline-block; line-height: 0; overflow: hidden; touch-action: none; }
  .stage img, .stage video, .stage canvas { max-width: 100%; max-height: 60vh; display: block; user-select: none; -webkit-user-drag: none; }
  /* Cover crop frame: the card's 1:√2 window over the image. The shadow dims the rest. */
  .frame { position: absolute; box-shadow: 0 0 0 9999px oklch(0% 0 0 / .55); outline: 2px solid #fff; cursor: grab; }
  .frame:active { cursor: grabbing; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
  select { width: 100%; padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 3px;
           background: var(--field); color: var(--fg); font: .85rem var(--mono); }
  input[type=range] { width: 100%; accent-color: var(--fg); }
  .fine { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem; gap: .6rem; align-items: center; }
  #editTools { margin-top: 1rem; padding-top: .2rem; border-top: 1px solid var(--line); }
  /* Crop and rotate. The stage is the bounding box of the rotated picture; the crop is a
     fraction of it, as the processor reads it (processor/media.py: edit_filters). */
  .cropstage { position: relative; line-height: 0; overflow: hidden; touch-action: none; user-select: none;
               background: repeating-conic-gradient(var(--line) 0 25%, var(--field) 0 50%) 0 0 / 16px 16px; }
  .cropstage img { position: absolute; max-width: none; max-height: none; pointer-events: none; transform-origin: 50% 50%; }
  .cropbox { position: absolute; cursor: move; outline: 1px solid #fff; box-shadow: 0 0 0 9999px oklch(0% 0 0 / .55);
             background:
               linear-gradient(#fff5, #fff5) 33.333% 0 / 1px 100% no-repeat,
               linear-gradient(#fff5, #fff5) 66.666% 0 / 1px 100% no-repeat,
               linear-gradient(#fff5, #fff5) 0 33.333% / 100% 1px no-repeat,
               linear-gradient(#fff5, #fff5) 0 66.666% / 100% 1px no-repeat; }
  .cropbox i { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: #fff; border: 1px solid #000; }
  .cropbox i[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; }
  .cropbox i[data-h=n] { left: 50%; top: 0; cursor: ns-resize; }
  .cropbox i[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; }
  .cropbox i[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; }
  .cropbox i[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; }
  .cropbox i[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
  .cropbox i[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; }
  .cropbox i[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }
  footer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); }
  footer .bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
  .when { display: grid; grid-template-columns: 9.5rem 5.5rem auto; gap: .5rem; justify-content: start; }
  .when input { font-family: var(--mono); }
  .when input.invalid { border-color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div>
    <div class="path">
      <span class="root" id="rootName"></span>/<span class="pathbox"><input id="slugInput" spellcheck="false" autocomplete="off" aria-label="folder" role="combobox" aria-controls="folderMenu" aria-expanded="false"><ul class="menu" id="folderMenu" role="listbox" hidden></ul></span>
    </div>
    <div class="mono bad" id="pathWarn" hidden></div>
  </div>
  <div class="seg" id="kinds" hidden>
    <button type="button" data-kind="collection">collection</button>
    <button type="button" data-kind="piece">piece</button>
    <button type="button" data-kind="writing">writing</button>
  </div>
</header>

<main id="picker" hidden>
  <ul class="folders" id="folders"></ul>
</main>

<main id="editor" hidden>
  <section class="top">
    <div>
      <label for="title">title</label>
      <input type="text" id="title">
      <label for="date">date</label>
      <div class="when">
        <input type="text" id="date" maxlength="10" placeholder="DD/MM/YYYY" inputmode="numeric" autocomplete="off" aria-label="date">
        <input type="text" id="time" maxlength="8" placeholder="HH:MM" inputmode="numeric" autocomplete="off" aria-label="time">
        <button type="button" id="now">now</button>
      </div>
      <p class="hint" id="tz"></p>
      <label for="description">description</label>
      <textarea id="description"></textarea>
      <label for="tagInput">tags</label>
      <div class="tags" id="tags"><input type="text" id="tagInput" aria-label="add tag"></div>
    </div>
    <aside>
      <label>card</label>
      <div class="card">
        <div class="art" id="cardArt"></div>
        <h2 id="cardTitle"></h2>
        <time id="cardDate" class="muted"></time>
        <div id="cardDesc" class="desc"></div>
        <div class="chips" id="cardTags"></div>
      </div>
    </aside>
  </section>

  <section id="mediaSection">
    <div class="mediahead">
      <label>media <span class="muted" id="mediaCount"></span></label>
      <div class="seg" id="sorts" aria-label="sort">
        <button type="button" data-sort="position">position</button>
        <button type="button" data-sort="date">date</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="detail" id="detail" hidden>
      <div class="big" id="bigArt"></div>
      <div>
        <div class="mono muted" id="detailName"></div>
        <label for="itemTitle">title</label>
        <input type="text" id="itemTitle">
        <label for="itemCaption">caption</label>
        <textarea id="itemCaption" rows="2" class="caption"></textarea>
        <label for="itemPosition">position</label>
        <input type="number" id="itemPosition" min="1" step="1">
        <label><input type="checkbox" id="itemIncluded"> include</label>
        <div class="row">
          <button type="button" id="moveLeft">←</button>
          <button type="button" id="moveRight">→</button>
          <button type="button" id="coverToggle" aria-pressed="false">cover</button>
          <button type="button" id="centerCrop" hidden>center</button>
          <button type="button" id="editToggle" aria-pressed="false" hidden>crop / rotate</button>
        </div>
        <div id="editTools" hidden>
          <label>rotate</label>
          <div class="row" style="margin-top:0">
            <button type="button" id="rotL" title="90° counter-clockwise">⟲ 90°</button>
            <button type="button" id="rotR" title="90° clockwise">⟳ 90°</button>
          </div>
          <label for="fineRange">straighten</label>
          <div class="fine">
            <input type="range" id="fineRange" min="-45" max="45" step="0.1" value="0" title="double-click to reset">
            <input type="number" id="fineNum" min="-45" max="45" step="0.1" value="0" aria-label="degrees">
          </div>
          <label for="aspect">crop aspect</label>
          <select id="aspect">
            <option value="free">free</option>
            <option value="orig">original</option>
            <option value="1">1:1</option>
            <option value="1.5">3:2</option><option value="0.6666667">2:3</option>
            <option value="1.3333333">4:3</option><option value="0.75">3:4</option>
            <option value="1.25">5:4</option><option value="0.8">4:5</option>
            <option value="1.7777778">16:9</option><option value="0.5625">9:16</option>
            <option value="1.41421356">1:√2 (card)</option>
          </select>
          <div class="row">
            <button type="button" id="cropFit" title="largest crop with no empty corners">fit</button>
            <button type="button" id="cropFull" title="no crop">no crop</button>
            <button type="button" id="editReset">reset</button>
          </div>
          <p class="hint" id="cropInfo"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="bodySection" hidden>
    <label for="body">body <span class="muted" id="bodyFile"></span></label>
    <textarea class="body" id="body"></textarea>
  </section>
</main>

<footer id="footer" hidden>
  <div class="bar">
    <button type="button" class="primary" id="save">save ⌘S</button>
    <span class="mono" id="status"></span>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let folders = [];
let slug = "";
let state = null;
let selected = null;
let dirty = false;

const media = (name) => `/media/${encodeURIComponent(slug)}/${encodeURIComponent(name)}`;
const shown = (item) => item.title || item.default_title;
// Older servers or manifests may omit fields; never show "undefined".
const clean = (items) => items.map((i) => ({ title: "", caption: "", rotate: 0, crop: null, ...i }));
const included = () => state.items.filter((i) => i.included);
// Order shown in the grid. "date" mirrors the site: capture date first, oldest
// first (stable), then undated files in position order. Dragging only edits position.
const ordered = () => {
  if (state.sort !== "date") return state.items;
  const dated = state.items.filter((i) => i.captured).sort((a, b) => (a.captured < b.captured ? -1 : a.captured > b.captured ? 1 : 0));
  return [...dated, ...state.items.filter((i) => !i.captured)];
};
const coverItem = () => state.kind === "collection" && state.items.find((i) => i.name === state.thumbnail && i.included);
const focusCss = () => `${state.thumbnail_focus[0]}% ${state.thumbnail_focus[1]}%`;
const CARD = Math.SQRT2;

function pad(n) { return String(n).padStart(2, "0"); }
// Swiss convention: DD/MM/YYYY (also DD.MM.YYYY), 24h HH:MM[:SS], local time zone.
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
function showWhen(d) {
  $("date").value = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  $("time").value = `${pad(d.getHours())}:${pad(d.getMinutes())}` + (d.getSeconds() ? `:${pad(d.getSeconds())}` : "");
}
// Returns a local Date, or null if the fields do not form a real date and time.
function readWhen() {
  const dm = $("date").value.trim().match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);
  const tm = $("time").value.trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  $("date").classList.toggle("invalid", !dm);
  $("time").classList.toggle("invalid", !tm);
  if (!dm || !tm) return null;
  const [day, month, year] = [+dm[1], +dm[2], +dm[3]];
  const [h, mi, s] = [+tm[1], +tm[2], +(tm[3] || 0)];
  const d = new Date(year, month - 1, day, h, mi, s);
  const real = d.getDate() === day && d.getMonth() === month - 1 && d.getHours() === h && mi < 60 && s < 60;
  $("date").classList.toggle("invalid", !real);
  $("time").classList.toggle("invalid", !real);
  return real ? d : null;
}
function offsetOf(d) {
  const m = -d.getTimezoneOffset();
  return `${m < 0 ? "-" : "+"}${pad(Math.floor(Math.abs(m) / 60))}:${pad(Math.abs(m) % 60)}`;
}
// ISO 8601 in local time with the offset valid on that date (DST aware).
function isoLocal(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${offsetOf(d)}`;
}
function nowMinute() { const d = new Date(); d.setSeconds(0, 0); return d; }

// ── Crop and rotate ──────────────────────────────────────────────
// item.rotate: degrees clockwise, 0 to 360. item.crop: [x, y, w, h] as fractions of the
// bounding box of the rotated picture, or null. The processor makes the same picture
// from the original (processor/media.py: edit_filters). Keep the two in step.
const RAD = Math.PI / 180;
const isEdited = (i) => i.type === "image" && (!!i.rotate || !!i.crop);
const editSig = (i) => (isEdited(i) ? JSON.stringify([i.rotate, i.crop]) : "");
function frameSize(nw, nh, deg) {
  const c = Math.abs(Math.cos(deg * RAD)), s = Math.abs(Math.sin(deg * RAD));
  return [nw * c + nh * s, nw * s + nh * c];
}
const normRot = (deg) => {
  const r = Math.round((((deg % 360) + 360) % 360) * 10) / 10;
  return r >= 360 ? 0 : r;
};
const fineOf = (deg) => deg - Math.round(deg / 90) * 90;
// Largest axis-aligned crop with no empty corners, in the aspect of the upright picture.
function inscribed(nw, nh, deg) {
  const q = Math.round(deg / 90), a = Math.abs(fineOf(deg)) * RAD;
  if (a < 1e-6) return null;
  const [w, h] = q % 2 ? [nh, nw] : [nw, nh];
  const c = Math.cos(a), s = Math.sin(a);
  const k = Math.min(w / (w * c + h * s), h / (w * s + h * c));
  const cw = (k * w) / (w * c + h * s), ch = (k * h) / (w * s + h * c);
  return [(1 - cw) / 2, (1 - ch) / 2, cw, ch];
}
// Turn a crop with the picture by a quarter turn (clockwise: +1, counter-clockwise: -1).
function turnCrop(crop, dir) {
  if (!crop) return null;
  const [x, y, w, h] = crop;
  return dir > 0 ? [1 - y - h, x, h, w] : [y, 1 - x - w, h, w];
}
const isFull = (c) => c[0] < 1e-4 && c[1] < 1e-4 && c[2] > 0.9999 && c[3] > 0.9999;
const srcImages = new Map();
function loadSource(url) {
  if (!srcImages.has(url)) {
    srcImages.set(url, new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    }));
  }
  return srcImages.get(url);
}
// Draw the edited picture into a canvas, at most `max` px on the long side.
function editedCanvas(item, max) {
  const cv = document.createElement("canvas");
  loadSource(media(item.name)).then((img) => {
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const [W, H] = frameSize(nw, nh, item.rotate || 0);
    const c = item.crop || [0, 0, 1, 1];
    const k = Math.min(1, max / Math.max(W * c[2], H * c[3]));
    cv.width = Math.max(1, Math.round(W * c[2] * k));
    cv.height = Math.max(1, Math.round(H * c[3] * k));
    const g = cv.getContext("2d");
    g.imageSmoothingQuality = "high";
    g.translate(-c[0] * W * k, -c[1] * H * k);
    g.translate((W * k) / 2, (H * k) / 2);
    g.rotate((item.rotate || 0) * RAD);
    g.drawImage(img, (-nw * k) / 2, (-nh * k) / 2, nw * k, nh * k);
    cv.dispatchEvent(new Event("load"));
  }, () => cv.dispatchEvent(new Event("error")));
  return cv;
}

function artFor(item, opts = {}) {
  if (isEdited(item) && !opts.raw) {
    const cv = editedCanvas(item, opts.controls || opts.eager ? 1600 : 480);
    cv.addEventListener("error", () => { const d = document.createElement("div"); d.className = "fallback"; d.textContent = item.name; cv.replaceWith(d); }, { once: true });
    return cv;
  }
  const fallback = () => { const d = document.createElement("div"); d.className = "fallback"; d.textContent = item.name; return d; };
  let el;
  if (item.type === "video") {
    el = document.createElement("video");
    // #t=0.1 makes the browser paint a first frame without autoplay.
    Object.assign(el, { src: media(item.name) + (opts.autoplay || opts.controls ? "" : "#t=0.1"), muted: true, loop: true, playsInline: true, autoplay: !!opts.autoplay, controls: !!opts.controls });
    el.preload = "metadata";
  } else {
    el = document.createElement("img");
    el.src = media(item.name);
    el.loading = opts.eager ? "eager" : "lazy";
    el.alt = "";
    el.draggable = false;
  }
  el.addEventListener("error", () => el.replaceWith(fallback()), { once: true });
  return el;
}

function markDirty() { dirty = true; $("status").textContent = "unsaved"; $("status").title = ""; }

// Preview of Hugo's `markdownify` (goldmark: unsafe = false, typographer,
// linkify, strikethrough). Inline markdown and paragraphs only. HTML is
// escaped first; raw tags are dropped like Hugo does, their text stays.
function markdownify(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const attr = (s) => esc(s).replace(/"/g, "&quot;");
  const safeUrl = (u) => /^(https?:|mailto:|\/|#)/i.test(u) ? u : "#";
  const inline = (text) => {
    const held = [];
    const hold = (html) => `\u0000${held.push(html) - 1}\u0000`;
    let s = text.replace(/<!--[\s\S]*?-->|<\/?[A-Za-z][^>]*>/g, "");
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${c}</code>`));
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) =>
      hold(`<a href="${attr(safeUrl(url.replace(/&amp;/g, "&")))}">`) + label + hold("</a>"));
    s = s.replace(/https?:\/\/[^\s<\u0000]*[^\s<\u0000.,;:!?)'"]/g, (url) =>
      hold(`<a href="${attr(url.replace(/&amp;/g, "&"))}">${url}</a>`));
    s = s.replace(/---/g, "&mdash;").replace(/--/g, "&ndash;").replace(/\.\.\./g, "&hellip;")
      .replace(/"([^"]*)"/g, "&ldquo;$1&rdquo;")
      .replace(/(\w)'(\w)/g, "$1&rsquo;$2")
      .replace(/'([^']*)'/g, "&lsquo;$1&rsquo;");
    s = s.replace(/~~(?=\S)(.+?)(?<=\S)~~/g, "<del>$1</del>")
      .replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^\w])__(?=\S)(.+?)(?<=\S)__(?!\w)/g, "$1<strong>$2</strong>")
      .replace(/\*(?=\S)(.+?)(?<=\S)\*/g, "<em>$1</em>")
      .replace(/(^|[^\w])_(?=\S)(.+?)(?<=\S)_(?!\w)/g, "$1<em>$2</em>");
    while (s.includes("\u0000")) s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => held[+i]);
    return s;
  };
  const paras = src.trim().split(/\n\s*\n/).filter((p) => p.trim());
  return paras.map((p) => `<p>${inline(p.trim())}</p>`).join("");
}

function renderCardText() {
  $("cardTitle").textContent = $("title").value;
  const d = readWhen();
  $("tz").textContent = `${TZ} UTC${offsetOf(d || new Date())}`;
  $("cardDate").textContent = d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : "";
  $("cardDesc").innerHTML = markdownify($("description").value);
  $("cardTags").replaceChildren(...state.tags.map((t) => Object.assign(document.createElement("span"), { className: "chip", textContent: t })));
}

let cardKey = null;
function renderCardArt() {
  const cover = coverItem();
  const key = JSON.stringify([slug, state.kind, state.thumbnail, included().map((i) => [i.name, editSig(i)])]);
  if (key !== cardKey) {
    cardKey = key;
    const art = $("cardArt");
    art.replaceChildren();
    art.classList.remove("mosaic");
    const items = included();
    if (state.kind === "piece" || cover) {
      const first = cover || items[0];
      if (first) art.append(artFor(first, { autoplay: true, eager: true }));
    } else {
      art.classList.add("mosaic");
      items.slice(0, 9).forEach((i) => art.append(artFor(i, { autoplay: true })));
    }
  }
  const single = cover && $("cardArt").firstElementChild;
  if (single) single.style.objectPosition = focusCss();
}

function renderGrid() {
  const grid = $("grid");
  grid.replaceChildren();
  const byDate = state.sort === "date";
  const shownOrder = ordered();
  shownOrder.forEach((item) => {
    const index = state.items.indexOf(item);
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "tile" + (item.included ? "" : " off") + (item === selected ? " selected" : "");
    tile.draggable = !byDate;
    tile.title = item.captured ? item.captured.replace("T", " ") : "no capture date";
    const art = document.createElement("span");
    art.className = "art";
    art.append(artFor(item));
    const badges = document.createElement("span");
    badges.className = "badges";
    const add = (t) => badges.append(Object.assign(document.createElement("span"), { className: "badge", textContent: t }));
    if (item.included) add(String(shownOrder.filter((i) => i.included).indexOf(item) + 1));
    if (item.type === "video") add("video");
    if (isEdited(item)) add("edited");
    if (item === coverItem()) add("cover");
    const cap = Object.assign(document.createElement("span"), { className: "cap", textContent: shown(item) });
    tile.append(art, badges, cap);
    tile.onclick = () => { selected = item; render(); };
    tile.ondragstart = (e) => { e.dataTransfer.setData("text/plain", String(index)); };
    tile.ondragover = (e) => { e.preventDefault(); tile.classList.add("drop"); };
    tile.ondragleave = () => tile.classList.remove("drop");
    tile.ondrop = (e) => {
      e.preventDefault();
      if (byDate) return;
      const from = Number(e.dataTransfer.getData("text/plain"));
      if (from === index) return;
      const [moved] = state.items.splice(from, 1);
      state.items.splice(index, 0, moved);
      touch();
    };
    grid.append(tile);
  });
}

// Crop frame over the big preview of the cover. object-fit: cover crops one
// axis only. object-position p% puts the frame at p% of the free travel,
// so the frame offset maps 1:1 to the stored focus.
let detailKey = null;
function frameGeometry(stage) {
  const el = stage.querySelector("img, video");
  const w = el.clientWidth, h = el.clientHeight;
  const nw = el.naturalWidth || el.videoWidth || el.width, nh = el.naturalHeight || el.videoHeight || el.height;
  if (!w || !h || !nw || !nh) return null;
  const wide = nw / nh > CARD;
  const fw = wide ? h * CARD : w, fh = wide ? h : w / CARD;
  return { w, h, fw, fh, travelX: w - fw, travelY: h - fh };
}
function placeFrame() {
  const stage = $("bigArt").querySelector(".stage");
  const frame = stage && stage.querySelector(".frame");
  if (!frame) return;
  const g = frameGeometry(stage);
  if (!g) return;
  const [fx, fy] = state.thumbnail_focus;
  Object.assign(frame.style, {
    width: `${g.fw}px`, height: `${g.fh}px`,
    left: `${(fx / 100) * g.travelX}px`, top: `${(fy / 100) * g.travelY}px`,
  });
}
function bindFrame(stage, frame) {
  let start = null;
  frame.addEventListener("pointerdown", (e) => {
    const g = frameGeometry(stage);
    if (!g) return;
    frame.setPointerCapture(e.pointerId);
    start = { x: e.clientX, y: e.clientY, focus: [...state.thumbnail_focus], g };
  });
  frame.addEventListener("pointermove", (e) => {
    if (!start) return;
    const { g } = start;
    const clamp = (v) => Math.min(100, Math.max(0, Math.round(v)));
    const fx = g.travelX > 0.5 ? clamp(start.focus[0] + ((e.clientX - start.x) / g.travelX) * 100) : 50;
    const fy = g.travelY > 0.5 ? clamp(start.focus[1] + ((e.clientY - start.y) / g.travelY) * 100) : 50;
    if (fx === state.thumbnail_focus[0] && fy === state.thumbnail_focus[1]) return;
    state.thumbnail_focus = [fx, fy];
    markDirty();
    placeFrame();
    renderCardArt();
  });
  const end = () => { start = null; };
  frame.addEventListener("pointerup", end);
  frame.addEventListener("pointercancel", end);
}

function renderDetail() {
  $("detail").hidden = !selected;
  if (!selected) return;

  if (selected.type === "video" || selected !== editTarget) editing = false;
  const key = editing ? `${slug}/${selected.name}/edit` : `${slug}/${selected.name}/${isCover}/${editSig(selected)}`;
  if (detailKey !== key) {

    }

  const rank = included().indexOf(selected);
  $("itemPosition").disabled = !selected.included;
  $("itemPosition").max = included().length;
  if (document.activeElement !== $("itemPosition")) $("itemPosition").value = rank < 0 ? "" : rank + 1;
  $("coverToggle").hidden = state.kind !== "collection";
  $("coverToggle").setAttribute("aria-pressed", isCover);
  $("centerCrop").hidden = !isCover || editing;
}

let editing = false;
let editTarget = null;
let editRatio = null; // locked width / height of the crop box, or null for free
const MIN_BOX = 0.04; // smallest crop side, as a fraction

function buildEditStage() {
  const stage = document.createElement("div");
  stage.className = "cropstage";
  const img = document.createElement("img");
  img.src = media(selected.name);
  img.draggable = false;
  img.addEventListener("load", layoutEdit);
  img.addEventListener("error", () => stage.replaceChildren(Object.assign(document.createElement("div"), { className: "fallback", textContent: selected.name })));
  const box = document.createElement("div");
  box.className = "cropbox";
  for (const h of ["nw", "n", "ne", "e", "se", "s", "sw", "w"]) {
    const dot = document.createElement("i");
    dot.dataset.h = h;
    box.append(dot);
  }
  stage.append(img, box);
  bindCrop(stage, box);
  $("bigArt").replaceChildren(stage);
}

function layoutEdit() {
  if (!editing || !selected) return;
  const stage = $("bigArt").querySelector(".cropstage");
  const img = stage && stage.querySelector("img");
  const box = stage && stage.querySelector(".cropbox");
  if (!img || !box || !img.naturalWidth) return;
  const nw = img.naturalWidth, nh = img.naturalHeight, rot = selected.rotate || 0;
  const [W, H] = frameSize(nw, nh, rot);
  const k = Math.min(Math.max(160, $("bigArt").clientWidth - 2) / W, (innerHeight * 0.62) / H);
  stage.style.width = `${W * k}px`;
  stage.style.height = `${H * k}px`;
  Object.assign(img.style, {
    width: `${nw * k}px`, height: `${nh * k}px`,
    left: `${(W * k - nw * k) / 2}px`, top: `${(H * k - nh * k) / 2}px`,
    transform: `rotate(${rot}deg)`,
  });
  const c = selected.crop || [0, 0, 1, 1];
  Object.assign(box.style, { left: `${c[0] * 100}%`, top: `${c[1] * 100}%`, width: `${c[2] * 100}%`, height: `${c[3] * 100}%` });
  const fine = fineOf(rot);
  if (document.activeElement !== $("fineRange")) $("fineRange").value = fine;
  if (document.activeElement !== $("fineNum")) $("fineNum").value = Math.round(fine * 10) / 10;
  const bw = c[2] * W, bh = c[3] * H;
  $("cropInfo").textContent = `${rot}° · crop ${(c[2] * 100).toFixed(0)}% × ${(c[3] * 100).toFixed(0)}% · ${(bw / bh).toFixed(3)}:1${selected.crop ? "" : " (no crop)"}`;
}

function sourceSize() {
  const img = $("bigArt").querySelector(".cropstage img");
  return img && img.naturalWidth ? [img.naturalWidth, img.naturalHeight] : null;
}

// Largest centered rectangle of the given width/height ratio inside rect [x, y, w, h] (pixels).
function fitRatio(rect, ratio) {
  const [x, y, w, h] = rect;
  const [nw, nh] = w / h > ratio ? [h * ratio, h] : [w, w / ratio];
  return [x + (w - nw) / 2, y + (h - nh) / 2, nw, nh];
}

// New rect [x, y, w, h] in pixels for a drag. mode: "move" or a handle (n, ne, ...).
function dragRect(mode, r, dx, dy, W, H, ratio) {
  const min = Math.max(MIN_BOX * Math.min(W, H), 8);
  let [l, t] = [r[0], r[1]];
  let [rr, b] = [r[0] + r[2], r[1] + r[3]];
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  if (mode === "move") {
    l = clamp(l + dx, 0, W - r[2]); t = clamp(t + dy, 0, H - r[3]);
    return [l, t, r[2], r[3]];
  }
  const hasW = mode.includes("w"), hasE = mode.includes("e"), hasN = mode.includes("n"), hasS = mode.includes("s");
  if (!ratio) {
    if (hasW) l = clamp(l + dx, 0, rr - min);
    if (hasE) rr = clamp(rr + dx, l + min, W);
    if (hasN) t = clamp(t + dy, 0, b - min);
    if (hasS) b = clamp(b + dy, t + min, H);
    return [l, t, rr - l, b - t];
  }
  const corner = mode.length === 2;
  let w, h;
  if (corner) {
    const nw = hasW ? rr - clamp(l + dx, 0, rr - min) : clamp(rr + dx, l + min, W) - l;
    const nh = hasN ? b - clamp(t + dy, 0, b - min) : clamp(b + dy, t + min, H) - t;
    [w, h] = nw / nh > ratio ? [nw, nw / ratio] : [nh * ratio, nh];
    const maxW = hasW ? rr : W - l, maxH = hasN ? b : H - t;
    if (w > maxW) [w, h] = [maxW, maxW / ratio];
    if (h > maxH) [w, h] = [maxH * ratio, maxH];
    if (w < min) [w, h] = [min, min / ratio];
    if (h < min) [w, h] = [min * ratio, min];
    return [hasW ? rr - w : l, hasN ? b - h : t, w, h];
  }
  if (hasW || hasE) {
    const cy = t + (b - t) / 2;
    w = hasW ? rr - clamp(l + dx, 0, rr - min) : clamp(rr + dx, l + min, W) - l;
    w = Math.min(w, (2 * Math.min(cy, H - cy)) * ratio, hasW ? rr : W - l);
    w = Math.max(w, Math.min(min, (2 * Math.min(cy, H - cy)) * ratio));
    h = w / ratio;
    return [hasW ? rr - w : l, cy - h / 2, w, h];
  }
  const cx = l + (rr - l) / 2;
  h = hasN ? b - clamp(t + dy, 0, b - min) : clamp(b + dy, t + min, H) - t;
  h = Math.min(h, (2 * Math.min(cx, W - cx)) / ratio, hasN ? b : H - t);
  h = Math.max(h, Math.min(min, (2 * Math.min(cx, W - cx)) / ratio));
  w = h * ratio;
  return [cx - w / 2, hasN ? b - h : t, w, h];
}

function currentRatio() {
  if (editRatio === null) return null;
  return editRatio;
}

function setCrop(rectPx, W, H) {
  const c = [rectPx[0] / W, rectPx[1] / H, rectPx[2] / W, rectPx[3] / H].map((v) => Math.round(v * 10000) / 10000);
  selected.crop = isFull(c) ? null : c;
}

function bindCrop(stage, box) {
  let drag = null;
  box.addEventListener("pointerdown", (e) => {
    const handle = e.target.dataset.h;
    const W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H) return;
    const c = selected.crop || [0, 0, 1, 1];
    box.setPointerCapture(e.pointerId);
    drag = { mode: handle || "move", x: e.clientX, y: e.clientY, W, H, rect: [c[0] * W, c[1] * H, c[2] * W, c[3] * H] };
    e.preventDefault();
  });
  box.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const next = dragRect(drag.mode, drag.rect, e.clientX - drag.x, e.clientY - drag.y, drag.W, drag.H, currentRatio());
    setCrop(next, drag.W, drag.H);
    markDirty();
    layoutEdit();
  });
  const end = () => { if (drag) { drag = null; render(); } };
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
}

function applyRatio() {
  const v = $("aspect").value;
  const src = sourceSize();
  if (v === "free" || !src) { editRatio = null; return; }
  const q = Math.round((selected.rotate || 0) / 90);
  editRatio = v === "orig" ? (q % 2 ? src[1] / src[0] : src[0] / src[1]) : Number(v);
  const [W, H] = frameSize(src[0], src[1], selected.rotate || 0);
  // The ratio is of the crop in picture pixels; the box is in stage fractions.
  const c = selected.crop || [0, 0, 1, 1];
  const rect = fitRatio([c[0] * W, c[1] * H, c[2] * W, c[3] * H], editRatio);
  setCrop(rect, W, H);
  editRatioStage();
  markDirty();
  layoutEdit();
  render();
}
// The stage keeps the picture's proportions (W:H), so a pixel ratio is the same on screen.
function editRatioStage() {}

function setRotation(deg, crop) {
  selected.rotate = normRot(deg);
  selected.crop = crop;
  markDirty();
  layoutEdit();
}
function turn(dir) {
  setRotation((selected.rotate || 0) + dir * 90, turnCrop(selected.crop, dir));
  render();
}
function straighten(fine, final) {
  const q = Math.round((selected.rotate || 0) / 90);
  const src = sourceSize();
  const rot = normRot(q * 90 + Math.min(45, Math.max(-45, fine)));
  setRotation(rot, src ? inscribed(src[0], src[1], rot) : null);
  if (final) render();
}
$("rotL").onclick = () => turn(-1);
$("rotR").onclick = () => turn(1);
$("fineRange").addEventListener("input", () => straighten(Number($("fineRange").value), false));
$("fineRange").addEventListener("change", () => straighten(Number($("fineRange").value), true));
$("fineRange").addEventListener("dblclick", () => { $("fineRange").value = 0; straighten(0, true); });
$("fineNum").addEventListener("change", () => straighten(Number($("fineNum").value) || 0, true));
$("aspect").addEventListener("change", applyRatio);
$("cropFit").onclick = () => {
  const src = sourceSize();
  selected.crop = src ? inscribed(src[0], src[1], selected.rotate || 0) : null;
  markDirty(); layoutEdit(); render();
};
$("cropFull").onclick = () => { selected.crop = null; markDirty(); layoutEdit(); render(); };
$("editReset").onclick = () => { selected.rotate = 0; selected.crop = null; $("aspect").value = "free"; editRatio = null; markDirty(); layoutEdit(); render(); };
$("editToggle").onclick = () => {
  editing = !editing;
  editTarget = editing ? selected : null;
  $("aspect").value = "free";
  editRatio = null;
  render();
};
addEventListener("keydown", (e) => { if (e.key === "Escape" && editing) { editing = false; editTarget = null; render(); } });
addEventListener("resize", layoutEdit);

function render() { renderKind(); renderTags(); renderCardText(); renderCardArt(); renderGrid(); renderDetail(); }

function collect() {
  return {
    kind: state.kind,
    sort: state.sort,
    title: $("title").value,
    date: isoLocal(readWhen()),
    description: $("description").value,
    tags: state.tags,
    thumbnail: state.thumbnail,
    thumbnail_focus: state.thumbnail_focus,
    items: state.items.map(({ name, title, caption, included, rotate, crop }) => ({ name, title, caption, included, rotate, crop })),
    body: $("body").value,
  };
}

async function save() {
  if (!state) return;
  normalizeWhen();
  if (!readWhen()) { $("status").textContent = "invalid date"; return; }
  $("status").textContent = "saving…";
  const res = await fetch(`/api/save?f=${encodeURIComponent(slug)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(collect()) });
  const data = await res.json();
  if (!res.ok) { $("status").replaceChildren(Object.assign(document.createElement("span"), { className: "bad", textContent: data.error })); return; }
  dirty = false;
  $("status").textContent = "✓";
  $("status").title = "saved";
  const entry = folders.find((f) => f.name === slug);
  if (entry) entry.has_manifest = true;
}

function addTag() {
  const raw = $("tagInput").value.trim().toLowerCase().replace(/\s+/g, "-").replace(/,+$/, "");
  $("tagInput").value = "";
  if (raw && !state.tags.includes(raw)) { state.tags.push(raw); touch(); }
}

// Navigation: the path input names one child folder of the root.
async function loadFolders() {
  const data = await (await fetch("/api/folders")).json();
  folders = data.folders;
  $("rootName").textContent = data.root;
  $("folders").replaceChildren(...folders.map((f) => {
    const li = document.createElement("li");
    const a = Object.assign(document.createElement("a"), { href: `?f=${encodeURIComponent(f.name)}`, textContent: f.name });
    if (f.has_manifest) a.append(Object.assign(document.createElement("span"), { className: "muted", textContent: " ✓" }));
    a.onclick = (e) => { e.preventDefault(); open(f.name); };
    li.append(a);
    return li;
  }));
}

async function open(name, push = true) {
  if (name === slug && state) return;
  if (dirty && !confirm(`Discard unsaved changes in ${slug}?`)) { $("slugInput").value = slug; return; }
  const entry = folders.find((f) => f.name === name);
  if (name && !entry) { $("pathWarn").textContent = `no folder ${name}`; $("pathWarn").hidden = false; return; }
  $("pathWarn").hidden = true;
  slug = name; state = null; selected = null; dirty = false;
  detailKey = null; cardKey = null;
  $("slugInput").value = name;
  $("status").textContent = "";
  if (push) history.pushState(null, "", name ? `?f=${encodeURIComponent(name)}` : "/");
  document.title = name ? `${name} · exhib manifest` : "exhib manifest";
  $("picker").hidden = !!name;
  for (const id of ["editor", "footer", "kinds"]) $(id).hidden = !name;
  if (!name) return;
  if (!entry.slug_ok) { $("pathWarn").textContent = "not a slug"; $("pathWarn").hidden = false; }
  state = await (await fetch(`/api/state?f=${encodeURIComponent(name)}`)).json();
  state.items = clean(state.items);
  $("title").value = state.title;
  showWhen(state.date ? new Date(state.date) : nowMinute());
  $("description").value = state.description;
  $("body").value = state.body;
  $("bodyFile").textContent = state.body_file;
  render();
}

// Folder menu under the path: all folders on focus, filtered while typing.
// Arrows move, Enter or a click opens, Escape goes back.
let menuItems = [];
let menuActive = -1;
function renderMenu(filter) {
  const q = (filter || "").toLowerCase();
  const starts = folders.filter((f) => f.name.toLowerCase().startsWith(q));
  const contains = folders.filter((f) => !starts.includes(f) && f.name.toLowerCase().includes(q));
  menuItems = [...starts, ...contains];
  menuActive = menuItems.findIndex((f) => f.name === slug);
  if (menuActive < 0 && q) menuActive = 0;
  $("folderMenu").replaceChildren(...menuItems.map((f, i) => {
    const li = Object.assign(document.createElement("li"), { textContent: f.name, role: "option" });
    if (f.has_manifest) li.append(Object.assign(document.createElement("span"), { className: "muted", textContent: "✓" }));
    li.setAttribute("aria-selected", i === menuActive);
    li.addEventListener("mousedown", (e) => { e.preventDefault(); closeMenu(); open(f.name); $("slugInput").blur(); });
    return li;
  }));
  $("folderMenu").hidden = !menuItems.length;
  $("slugInput").setAttribute("aria-expanded", !$("folderMenu").hidden);
}
function closeMenu() { $("folderMenu").hidden = true; $("slugInput").setAttribute("aria-expanded", "false"); }
function moveMenu(step) {
  if (!menuItems.length) return;
  menuActive = (menuActive + step + menuItems.length) % menuItems.length;
  [...$("folderMenu").children].forEach((li, i) => li.setAttribute("aria-selected", i === menuActive));
  $("folderMenu").children[menuActive].scrollIntoView({ block: "nearest" });
}
$("slugInput").addEventListener("focus", () => { $("slugInput").select(); renderMenu(""); });
$("slugInput").addEventListener("input", () => renderMenu($("slugInput").value.trim()));
$("slugInput").addEventListener("blur", () => { closeMenu(); if ($("slugInput").value.trim() !== slug) $("slugInput").value = slug; });
$("slugInput").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if ($("folderMenu").hidden) renderMenu(""); moveMenu(e.key === "ArrowDown" ? 1 : -1); }
  else if (e.key === "Enter") {
    e.preventDefault();
    const pick = menuItems[menuActive] || folders.find((f) => f.name === $("slugInput").value.trim());
    closeMenu();
    if (pick) open(pick.name);
    $("slugInput").blur();
  } else if (e.key === "Escape") { $("slugInput").value = slug; $("slugInput").blur(); }
});
window.addEventListener("popstate", () => open(new URLSearchParams(location.search).get("f") || "", false));
for (const b of $("kinds").children) b.onclick = () => { state.kind = b.dataset.kind; touch(); };
for (const b of $("sorts").children) b.onclick = () => { state.sort = b.dataset.sort; touch(); };
// Date and time entry: a click or tab selects the whole field, so typing
// overwrites it. Separators insert themselves: 15112026 -> 15/11/2026,
// 1830 -> 18:30. A first digit that cannot start a two-digit day, month or
// hour ends that part at once (5 then 3 -> 5/3). A complete date moves on
// to the time. Leaving a field pads it (5/3/26 -> 05/03/2026, 930 -> 09:30).
// Up/Down step one day or one minute (Shift: month or hour).
const WHEN = {
  date: { sep: "/", seps: /[\/.]/, max: [2, 2, 4], single: [/^[4-9]$/, /^[2-9]$/] },
  time: { sep: ":", seps: /:/, max: [2, 2], single: [/^[3-9]$/] },
};
function autoSeparate(el, spec) {
  const parts = el.value.split(spec.seps);
  for (let i = 0; i < parts.length && i < spec.max.length; i++) {
    parts[i] = parts[i].replace(/\D/g, "");
    const last = i === spec.max.length - 1;
    const full = parts[i].length > spec.max[i] || (spec.single[i] && spec.single[i].test(parts[i][0] || "") && parts[i].length > 1);
    if (!last && full) {
      const cut = spec.single[i] && spec.single[i].test(parts[i][0]) ? 1 : spec.max[i];
      parts.splice(i + 1, 0, parts[i].slice(cut));
      parts[i] = parts[i].slice(0, cut);
    }
  }
  const out = parts.slice(0, spec.max.length);
  out[out.length - 1] = out[out.length - 1].slice(0, spec.max[out.length - 1]);
  el.value = out.join(spec.sep);
}
function normalizeWhen() {
  const dm = $("date").value.trim().match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2}|\d{4})$/);
  if (dm) $("date").value = `${pad(dm[1])}/${pad(dm[2])}/${dm[3].length === 2 ? "20" + dm[3] : dm[3]}`;
  const raw = $("time").value.trim();
  const tm = raw.match(/^(\d{1,2}):(\d{1,2})$/) || raw.match(/^(\d{1,2})(\d{2})$/) || raw.match(/^(\d{1,2})$/);
  if (tm) $("time").value = `${pad(tm[1])}:${pad(tm[2] || 0)}`;
  renderCardText();
}
for (const [id, spec] of Object.entries(WHEN)) {
  const el = $(id);
  // The first click after the field gets focus (by click, tab or the
  // jump from date to time) selects all. A second click places the caret.
  let fresh = false;
  el.addEventListener("focus", () => { fresh = true; el.select(); });
  el.addEventListener("mousedown", (e) => {
    if (document.activeElement === el && !fresh) return;
    e.preventDefault();
    if (document.activeElement !== el) el.focus();
    el.select();
    fresh = false;
  });
  el.addEventListener("keydown", () => { fresh = false; }, true);
  el.addEventListener("input", (e) => {
    if (e.inputType && e.inputType.startsWith("insert") && el.selectionStart === el.value.length) autoSeparate(el, spec);
    if (id === "date" && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(el.value) && readWhen()) $("time").focus();
  });
  el.addEventListener("blur", normalizeWhen);
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); id === "date" ? $("time").focus() : el.blur(); return; }
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    normalizeWhen();
    const d = readWhen() || nowMinute();
    const step = e.key === "ArrowUp" ? 1 : -1;
    if (id === "date") e.shiftKey ? d.setMonth(d.getMonth() + step) : d.setDate(d.getDate() + step);
    else e.shiftKey ? d.setHours(d.getHours() + step) : d.setMinutes(d.getMinutes() + step);
    showWhen(d);
    el.select();
    markDirty();
    renderCardText();
  });
}
$("now").onclick = () => { showWhen(nowMinute()); markDirty(); renderCardText(); };
for (const id of ["title", "date", "time", "description", "body"]) $(id).addEventListener("input", () => { markDirty(); renderCardText(); });
$("tagInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addTag(); }
  else if (e.key === "Backspace" && !$("tagInput").value && state.tags.length) { state.tags.pop(); touch(); }
});
$("tagInput").addEventListener("blur", addTag);
$("itemTitle").addEventListener("input", () => { selected.title = $("itemTitle").value; touch(); });
$("itemCaption").addEventListener("input", () => { selected.caption = $("itemCaption").value; markDirty(); });
$("itemIncluded").addEventListener("change", () => {
  selected.included = $("itemIncluded").checked;
  if (!selected.included && state.thumbnail === selected.name) state.thumbnail = "";
  touch();
});
const move = (delta) => {
  const i = state.items.indexOf(selected), j = i + delta;
  if (j < 0 || j >= state.items.length) return;
  [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
  touch();
};
// Move the selected item to position n among the included items.
function setPosition(n) {
  const list = included();
  const target = Math.min(Math.max(1, Math.round(n) || 1), list.length);
  if (list.indexOf(selected) === target - 1) return;
  state.items.splice(state.items.indexOf(selected), 1);
  const rest = included();
  const anchor = rest[target - 1];
  if (anchor) state.items.splice(state.items.indexOf(anchor), 0, selected);
  else state.items.splice(state.items.indexOf(rest[rest.length - 1]) + 1, 0, selected);
  touch();
}
$("itemPosition").addEventListener("change", () => setPosition(Number($("itemPosition").value)));
$("moveLeft").onclick = () => move(-1);
$("moveRight").onclick = () => move(1);
// One cover at most. On moves the cover to this item; off means mosaic.
$("coverToggle").onclick = () => {
  if (state.thumbnail === selected.name) state.thumbnail = "";
  else { state.thumbnail = selected.name; state.thumbnail_focus = [50, 50]; selected.included = true; }
  touch();
};
$("centerCrop").onclick = () => { state.thumbnail_focus = [50, 50]; touch(); };
window.addEventListener("resize", placeFrame);
$("save").onclick = save;
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

loadFolders().then(() => open(new URLSearchParams(location.search).get("f") || "", false));
</script>
</body>
</html>
