# Static Web Server (SWS) configuration for the exhib gallery.
# Baked into the exhib image (see Dockerfile); served at /etc/sws/sws.toml.
# The infra repo carries no copy and references no SWS container.
#
# 1. root is /data/public, the Hugo output on the shared PVC.
# 2. port is 8080. The binary default is 80.
# 3. health = true enables /health for the probes. SWS has no /livez or /readyz.
# 4. no-cache everywhere. Clients revalidate with If-Modified-Since;
#    unchanged files are answered 304. No file in this site carries a
#    content hash in its name (css/site.css is the stable name), so an
#    immutable rule would pin stale bytes in returning browsers.
[general]
root = "/data/public"
port = 8080
health = true

[advanced]

[[advanced.headers]]
source = "**"
headers = { Cache-Control = "no-cache" }
