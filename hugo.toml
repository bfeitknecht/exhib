baseURL = "https://gallery.0xbf.ch/"
title = "exhib"
defaultContentLanguage = "en"

locale = "en"
enableRobotsTXT = true
# Tag names stay as written (lowercase). Hugo title-cases list titles by default.
capitalizeListTitles = false
# The image keeps /app read-only for the runtime user: no .hugo_build.lock
# in the source dir (the app runs one build at a time).
noBuildLock = true

# Keep the default RSS media type. Pin baseName so the feed stays at /rss.xml.
[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "rss"
  isPlainText = true
  rel = "alternate"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.Atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "Atom"]
  section = ["HTML"]
  page = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  description = "A collection of pictures, videos, graphic designs, and writings."

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = false

[imaging]
  resampleFilter = "Lanczos"

[imaging.jpeg]
  quality = 88
[imaging.webp]
  quality = 88

[imaging.meta]
  fields = ["**"]
  sources = ["exif", "iptc", "xmp"]
