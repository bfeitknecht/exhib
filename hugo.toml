baseURL = "https://gallery.0xbf.ch/"
title = "exhib"
defaultContentLanguage = "en"

locale = "en"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

# Keep the default RSS media type. Pin baseName so the feed stays at /rss.xml.
[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "rss"
  isPlainText = true
  rel = "alternate"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.Atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "Atom"]
  section = ["HTML"]
  page = ["HTML"]

[params]
  description = "A collection of photographs and visual work."

[markup.goldmark.renderer]
  unsafe = false

[imaging]
  resampleFilter = "Lanczos"

[imaging.jpeg]
  quality = 88
[imaging.webp]
  quality = 88

[imaging.meta]
  fields = ["**"]
  sources = ["exif", "iptc", "xmp"]
