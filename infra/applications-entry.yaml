# Append this entry to kubernetes/cluster/applications.yaml in bfeitknecht/infra.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: exhib
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
  interval: 10m0s
  path: ./kubernetes/applications/exhib
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
