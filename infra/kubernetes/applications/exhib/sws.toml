# static-web-server — only what ENV cannot express.
#
# 1. Cache-Control: no-cache on everything (HTML, XML, media) so repeat visits
#    revalidate (Last-Modified -> 304) and uploads show up immediately.
# 2. Immutable 1-year caching on the content-hashed css/** (site.min.<sha256>.css,
#    built from assets/css).
[advanced]

[[advanced.headers]]
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
source = "**/css/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }
